<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
  <title id="title">Predicting Inference-Time Scaling Gains from Labeled Validation-Set Output Statistics</title>
  <desc id="desc">A Findings of EACL 2027 paper. Candidate models are ranked by predicted best-of-N gain, and only the top-ranked ones are scored with the reward model.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111c35"/>
      <stop offset="1" stop-color="#182b44"/>
    </linearGradient>
    <linearGradient id="gain" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2fb7a0"/>
      <stop offset="1" stop-color="#8af0b9"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="410" rx="24" fill="url(#background)"/>
  <circle cx="1320" cy="20" r="260" fill="#59cabe" opacity="0.035"/>
  <circle cx="1100" cy="440" r="250" fill="#8b8bfa" opacity="0.045"/>
  <rect x="60" y="42" width="246" height="32" rx="16" fill="#223c4a" stroke="#42675f"/>
  <text x="183" y="63" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9ce6cc" text-anchor="middle" letter-spacing="1.5">FINDINGS OF EACL 2027</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="142" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="1">Will best-of-N help?</text>
    <text x="60" y="198" font-size="26" font-weight="600" fill="#d7e2f0">Predicting Inference-Time Scaling Gains from</text>
    <text x="60" y="234" font-size="26" font-weight="600" fill="#d7e2f0">Labeled Validation-Set Output Statistics</text>
    <text x="60" y="294" font-size="19" fill="#9fb2c9">Rank candidate models by their predicted best-of-N gain from four</text>
    <text x="60" y="322" font-size="19" fill="#9fb2c9">statistics of sampled answers, then score only the top ones.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="830" y="92" font-size="14" font-weight="700" fill="#9ce6cc" letter-spacing="1.2">PREDICTED BEST-OF-N GAIN</text>
    <text x="1400" y="92" font-size="14" font-weight="700" fill="#8fa3bd" letter-spacing="1.2" text-anchor="end">REWARD MODEL</text>
    <g>
      <rect x="830" y="108" width="34" height="30" rx="7" fill="#e69f00"/>
      <rect x="876" y="110" width="330" height="26" rx="6" fill="url(#gain)"/>
      <text x="1400" y="129" font-size="17" font-weight="700" fill="#8af0b9" text-anchor="end">score</text>
    </g>
    <g>
      <rect x="830" y="150" width="34" height="30" rx="7" fill="#cc79a7"/>
      <rect x="876" y="152" width="262" height="26" rx="6" fill="url(#gain)"/>
      <text x="1400" y="171" font-size="17" font-weight="700" fill="#8af0b9" text-anchor="end">score</text>
    </g>
    <path d="M820 197 H1410" stroke="#5ce0d0" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
    <g opacity="0.45">
      <rect x="830" y="214" width="34" height="30" rx="7" fill="#009e73"/>
      <rect x="876" y="216" width="150" height="26" rx="6" fill="#3a516f"/>
      <text x="1400" y="235" font-size="17" fill="#8fa3bd" text-anchor="end">skip</text>
      <rect x="830" y="256" width="34" height="30" rx="7" fill="#0072b2"/>
      <rect x="876" y="258" width="96" height="26" rx="6" fill="#3a516f"/>
      <text x="1400" y="277" font-size="17" fill="#8fa3bd" text-anchor="end">skip</text>
      <rect x="830" y="298" width="34" height="30" rx="7" fill="#56b4e9"/>
      <rect x="876" y="300" width="40" height="26" rx="6" fill="#3a516f"/>
      <text x="1400" y="319" font-size="17" fill="#8fa3bd" text-anchor="end">skip</text>
    </g>
  </g>
  <text x="60" y="378" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c7d3e3">Luyang Zhang · Jingyan Li</text>
</svg>
